<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>As Time Goes By 時光造所 -POS</title>
    
    <link rel="icon" href="https://drive.google.com/file/d/17MDFfYz25QwjZRWWehnSPOrYPZVQJt1B/view?usp=sharing" type="image/x-icon">
    <link rel="shortcut icon" href="https://drive.google.com/file/d/17MDFfYz25QwjZRWWehnSPOrYPZVQJt1B/view?usp=sharing" type="image/png">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { --main-brown: #b0a496; --bg-cream: #fcf8f5; --accent-brown: #8c7b6c; --price-red: #d9534f; --profit-green: #6b8e23; }
        body { font-family: sans-serif; background: var(--bg-cream); margin: 0; display: flex; flex-direction: column; height: 100dvh; color: #5d5246; overflow: hidden; padding-bottom: env(safe-area-inset-bottom); -webkit-tap-highlight-color: transparent; }
        
        header { 
            background: var(--main-brown); 
            color: white; 
            padding: 8px 12px; 
            text-align: center; 
            font-size: 1.3em; 
            font-weight: bold; 
            flex-shrink: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
        }
        header img { height: 30px; width: auto; border-radius: 4px; }

        .nav-bar { 
            background: #e8e0d9; 
            padding: 10px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
            border-bottom: 2px solid #d1c7bc; 
            flex-shrink: 0; 
            align-items: center; 
        }
        .nav-btn { background: white; border: 1px solid #d1c7bc; padding: 6px 15px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-size: 1em; touch-action: manipulation; }
        .sync-btn { background: #ff9800; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-left: auto; touch-action: manipulation; }
        
        .main-content { display: flex; flex: 1; overflow: hidden; padding: 10px; gap: 10px; }
        .item-area { flex: 1.5; overflow-y: auto; background: white; border-radius: 15px; padding: 15px; border: 2px solid #e8e0d9; }
        .checkout-area { flex: 1.2; display: flex; flex-direction: column; gap: 10px; min-width: 340px; overflow-y: auto; }
        
        .cat-title { background: #fdf5f0; padding: 8px 15px; border-radius: 20px; margin: 15px 0 8px; font-weight: bold; border-left: 8px solid var(--main-brown); font-size: 1.2em; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 10px; }
        .p-btn { background: white; border: 1px solid #f0e6dd; border-radius: 12px; padding: 10px 5px; text-align: center; cursor: pointer; box-shadow: 2px 2px 0 #e8e0d9; min-height: 90px; display: flex; flex-direction: column; justify-content: center; touch-action: manipulation; }
        .p-name { font-size: 0.85em; font-weight: bold; margin-bottom: 5px; height: 2.8em; overflow: hidden; line-height: 1.4; }
        .p-price { color: #c2966d; font-size: 1.2em; font-weight: bold; }
        .p-stock { font-size: 0.8em; color: #999; }
        
        .card { background: white; border-radius: 15px; padding: 12px; border: 2px solid #e8e0d9; }
        #cart-list { max-height: 180px; overflow-y: auto; border-bottom: 2px dashed #e8e0d9; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; font-size: 1.1em; border-bottom: 1px solid #eee; }
        
        .big-input { font-size: 1.8em; padding: 10px; width: 100%; border-radius: 10px; border: 2px solid #d1c7bc; text-align: right; box-sizing: border-box; background: #fffcf5; font-weight: bold; -webkit-appearance: none; }
        .small-note { font-size: 1.1em; padding: 10px; width: 100%; border-radius: 8px; border: 1px solid #d1c7bc; box-sizing: border-box; margin-top: 5px; appearance: none; -webkit-appearance: none; }
        
        .quick-btn-row { display: flex; gap: 4px; margin-top: 6px; flex-wrap: nowrap; overflow-x: hidden; }
        .q-btn { flex: 1; padding: 8px 2px; font-size: 0.85em; border: 1px solid #d1c7bc; background: #fcfaf8; border-radius: 6px; cursor: pointer; white-space: nowrap; text-align: center; touch-action: manipulation; }
        
        .total-display { font-size: 3em; font-weight: bold; color: var(--price-red); text-align: right; margin: 5px 0; }
        .pay-btn { flex: 1; padding: 10px 4px; border-radius: 10px; border: 1px solid #ccc; background: white; cursor: pointer; font-weight: bold; font-size: 0.9em; white-space: nowrap; touch-action: manipulation; }
        .pay-btn.active { background: var(--accent-brown); color: white; border-color: var(--accent-brown); }
        
        #order-log-container { min-height: 250px; flex: 1; display: flex; flex-direction: column; }
        #order-log { flex: 1; overflow-y: auto; }

        #admin-panel, #history-panel { position: fixed; inset: 10px; background: white; z-index: 1000; border-radius: 20px; display: none; flex-direction: column; padding: 15px; border: 3px solid var(--main-brown); box-shadow: 0 0 50px rgba(0,0,0,0.3); }
        .admin-layout { display: flex; flex-direction: column; gap: 15px; flex: 1; overflow-y: auto; }
        @media (min-width: 768px) { .admin-layout { display: grid; grid-template-columns: 1.8fr 1fr; } }
        .add-row-top { background: #f0fdf4; padding: 15px; border: 2px solid var(--profit-green); border-radius: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
        .admin-table-container { overflow: auto; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f4f4f4; position: sticky; top: 0; padding: 10px; border: 1px solid #ddd; z-index: 5; font-size: 0.9em; }
        td { padding: 8px; border: 1px solid #ddd; text-align: center; }
        .del-x { color: red; font-weight: bold; cursor: pointer; font-size: 1.4em; }
        .edit-cat-btn, .del-cat-btn, .sort-cat-btn { color: white; border: none; padding: 5px 8px; border-radius: 5px; cursor: pointer; font-size: 0.8em; margin-left: 5px; }
        .edit-cat-btn { background: #3182ce; }
        .del-cat-btn { background: #ff4d4d; }
        .sort-cat-btn { background: #8c7b6c; }
    </style>
</head>
<body>

<header>
    <img src="您的LOGO圖片網址" alt="LOGO"> 
    As Time Goes By 時光造所 -POS
</header>

<div class="nav-bar">
    <div id="navbar" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
    <div id="barcode-status" style="padding: 5px 10px; background: #eee; border-radius: 10px; font-size: 0.8em; margin-left:auto;">⌛ 條碼槍就緒</div>
    <button class="sync-btn" onclick="syncOfflineData()">🔄 同步</button>
</div>

<div class="main-content">
    <div class="item-area" id="item-area">同步中...</div>
    <div class="checkout-area">
        <div class="card">
            <strong>🛒 當前清單 (條碼掃描中...)</strong>
            
            <div style="margin: 8px 0; display: flex; flex-direction: column; gap: 5px;">
                <input type="text" id="manual-barcode-input" placeholder="掃描或手動輸入代碼..." 
                       style="width: 100%; padding:10px; border:2px solid var(--main-brown); border-radius:10px; box-sizing:border-box; font-size:1em;"
                       onkeydown="if(event.key === 'Enter') { handleManualBarcode(this.value); this.value=''; }">
                
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="manual-name-input" placeholder="商品名稱(自行輸入)..." 
                           style="flex: 1.2; padding:10px; border:2px solid var(--accent-brown); border-radius:10px; box-sizing:border-box; font-size:1em;">
                    <input type="number" id="manual-price-input" placeholder="金額..." 
                           style="flex: 0.8; padding:10px; border:2px solid var(--accent-brown); border-radius:10px; box-sizing:border-box; font-size:1em;"
                           onkeydown="if(event.key === 'Enter') { addCustomPrice(this.value); }"
                           onblur="if(this.value !== '') { addCustomPrice(this.value); }">
                </div>
                <select id="manual-flavor-input" style="width: 100%; padding:10px; border:1px solid #d1c7bc; border-radius:8px; background:#fff; font-size:0.95em; -webkit-appearance: none;" onchange="handleFlavorChange(this.value)">
                    <option value="">-- 選擇口味 (可不選) --</option>
                    <option value="義式濃縮">義式濃縮</option>
                    <option value="美式咖啡(熱)">美式咖啡(熱)</option>
                    <option value="特選紅茶(熱)">特選紅茶(熱)</option>
                    <option value="茉香綠茶(熱)">茉香綠茶(熱)</option>
                    <option value="美式咖啡(冰)+10">美式咖啡(冰)+10</option>
                    <option value="濾掛咖啡+10">濾掛咖啡+10</option>
                    <option value="特選紅茶(冰)+10">特選紅茶(冰)+10</option>
                    <option value="柚子茶(熱)+10">柚子茶(熱)+10</option>
                    <option value="柚香紅茶(熱)+20">柚香紅茶(熱)+20</option>
                    <option value="柚子茶(冰)+20">柚子茶(冰)+20</option>
                    <option value="拿鐵(熱)+30">拿鐵(熱)+30</option>
                    <option value="柚香紅茶(冰)+30">柚香紅茶(冰)+30</option>
                    <option value="鮮奶茶(熱)+30">鮮奶茶(熱)+30</option>
                    <option value="水蜜桃蘋果茶+30">水蜜桃蘋果茶+30</option>
                    <option value="拿鐵(冰)+40">拿鐵(冰)+40</option>
                    <option value="鮮奶茶(冰)+40">鮮奶茶(冰)+40</option>
                    <option value="太妃糖拿鐵(熱)+50">太妃糖拿鐵(熱)+50</option>
                    <option value="太妃糖拿鐵(冰)+60">太妃糖拿鐵(冰)+60</option>
                </select>
            </div>

            <div id="cart-list"></div>
            <div style="margin-top:10px;">
                <input type="number" id="discount" class="big-input" placeholder="折扣金額" oninput="calc()">
                <div class="quick-btn-row">
                    <button class="q-btn" onclick="applyQuickDiscount('minus', 30)">-$30</button>
                    <button class="q-btn" onclick="applyQuickDiscount('minus', 50)">-$50</button>
                    <button class="q-btn" onclick="applyQuickDiscount('minus', 100)">-$100</button>
                    <button class="q-btn" onclick="applyQuickDiscount('percent', 0.95, '95折')">95折</button>
                    <button class="q-btn" onclick="applyQuickDiscount('percent', 0.9, '9折')">9折</button>
                    <button class="q-btn" onclick="applyQuickDiscount('percent', 0.85, '85折')">85折</button>
                    <button class="q-btn" onclick="applyQuickDiscount('percent', 0.8, '8折')">8折</button>
                    <button class="q-btn" onclick="applyQuickDiscount('reset', 0)" style="background:#eee;">重設</button>
                </div>
                <div class="quick-btn-row" style="margin-top:4px;">
                    <button class="q-btn" onclick="applyQuickDiscount('minus', 50); document.getElementById('discount-note').value='購物金券';" style="background:#fff7ed; border:1px solid #fdba74; color:#9a3412;">🎟️ 購物金券 (-$50)</button>
                </div>
                
                <select id="discount-note" class="small-note" style="background: white; -webkit-appearance: none;">
                    <option value="">-- 選擇折扣原因 --</option>
                    <option value="品牌－課程/餐飲">🏫 品牌－課程/餐飲</option>
                    <option value="品牌－空間">🏠 品牌－空間</option>
                    <option value="品牌寄售折扣">🏷️ 品牌寄售折扣</option>
                    <option value="追蹤">📱 追蹤</option>
                    <option value="朋友">🤝 朋友</option>
                    <option value="2件以上">✌️ 2件以上</option>
                    <option value="3件以上">🤟 3件以上</option>
                    <option value="滿額贈">🎁 滿額贈</option>
                    <option value="購物金券">🎟️ 購物金券</option>
                    <option value="其他">📝 其他</option>
                </select>
                <div style="margin-top:5px; display:flex; gap:5px;">
                    <button onclick="addExtraCost()" style="flex:1; padding:8px; background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; border-radius:8px; cursor:pointer; font-size:0.9em; font-weight:bold; touch-action:manipulation;">➕ 紀錄額外支出</button>
                </div>
            </div>
            <div class="total-display">$<span id="final-total">0</span></div>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px; margin-bottom:10px;">
                <button class="pay-btn active" id="btn-cash" onclick="setPay('現金')">💵 現金</button>
                <button class="pay-btn" id="btn-card" onclick="setPay('信用卡')">💳 信用卡</button>
                <button class="pay-btn" id="btn-line" onclick="setPay('LINE Pay')">🟢 LINEPay</button>
            </div>

            <input type="text" id="tax-id" class="small-note" placeholder="載具 / 統編 (可不填)" style="text-align: center; margin-bottom: 8px; border: 1px solid #8c7b6c;">

            <input type="number" id="cash-in" class="big-input" placeholder="實收金額" oninput="calcChange()"> 
            <div class="quick-btn-row">
                <button class="q-btn" onclick="applyQuickCash(100)">$100</button>
                <button class="q-btn" onclick="applyQuickCash(500)">$500</button>
                <button class="q-btn" onclick="applyQuickCash(1000)">$1000</button>
                <button class="q-btn" onclick="applyQuickCash(0)" style="background:#eee;">重設</button>
            </div>
            <div class="quick-btn-row" style="margin-top:4px;">
                <button class="q-btn" onclick="applyQuickCash(1)">$1</button>
                <button class="q-btn" onclick="applyQuickCash(5)">$5</button>
                <button class="q-btn" onclick="applyQuickCash(10)">$10</button>
                <button class="q-btn" onclick="applyQuickCash(50)">$50</button>
            </div>
            
            <div style="text-align:right; margin-top:5px; font-size: 1.3em;">找零: <span id="cash-change" style="font-weight:bold; color:red; font-size:1.8em;">0</span></div>
            
            <div style="margin: 10px 0; padding: 10px; background: #fff5eb; border-radius: 10px; border: 1px dashed var(--main-brown);">
                <label style="font-size: 0.9em; cursor: pointer;">
                    <input type="checkbox" id="backdate-mode" onclick="document.getElementById('manual-date').style.display = this.checked ? 'inline-block' : 'none'"> 
                    📅 補登過去日期資料
                </label>
                <input type="date" id="manual-date" style="display:none; margin-left:10px; padding:5px; border:1px solid #ccc; border-radius:5px;">
            </div>

            <button onclick="submitOrder()" style="width:100%; padding:20px; margin-top:15px; background:var(--profit-green); color:white; border:none; border-radius:15px; font-weight:bold; font-size:1.6em; touch-action:manipulation;">結帳完成</button>
        </div>
        <div class="card" id="order-log-container">
            <strong>📋 今日即時紀錄</strong>
            <div id="order-log"></div>
        </div>
    </div>
</div>

<div style="padding:10px; text-align:center; display: flex; justify-content: center; gap: 10px; flex-shrink: 0; margin-bottom: 5px;">
    <button onclick="toggleAdmin()" style="padding:15px 25px; border-radius:15px; background:white; border:3px solid var(--main-brown); font-weight:bold; font-size:1.1em; cursor:pointer; touch-action:manipulation;">🛠️ 商品管理 / 統計</button>
    <button onclick="toggleHistory()" style="padding:15px 25px; border-radius:15px; background:var(--accent-brown); color:white; border:none; font-weight:bold; font-size:1.1em; cursor:pointer; touch-action:manipulation;">📜 歷史紀錄 / 退貨</button>
</div>

<div id="history-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2 style="margin:0;">📜 歷史紀錄管理</h2>
        <div style="display:flex; gap:10px;">
            <button onclick="exportHistoryToExcel()" style="padding:8px 15px; background:#217346; color:white; border:none; border-radius:5px; cursor:pointer; touch-action:manipulation;">📥 匯出 Excel</button>
            <button onclick="clearAllHistory()" style="padding:8px 15px; background:#d9534f; color:white; border:none; border-radius:5px; cursor:pointer; touch-action:manipulation;">🧹 清空所有紀錄</button>
            <button onclick="toggleHistory()" style="padding:8px 15px;">✕ 關閉</button>
        </div>
    </div>
    <div style="background:#fdf5f0; padding:15px; border-radius:10px; margin-bottom:15px; display:flex; gap:15px; align-items:center;">
        <div>
            <label>單日：</label><input type="date" id="search-date" style="padding:8px;">
            <button onclick="searchHistory('day')" style="padding:8px 15px; background:var(--main-brown); color:white; border:none; cursor:pointer; touch-action:manipulation;">🔍 查詢</button>
            <button onclick="searchToday()" style="padding:8px 15px; background:#4a5568; color:white; border:none; border-radius:4px; margin-left:5px; cursor:pointer; touch-action:manipulation;">📅 當日</button>
        </div>
        <div style="border-left: 2px solid #ddd; padding-left: 15px;">
            <label>當月：</label><input type="month" id="search-month" style="padding:8px;">
            <button onclick="searchHistory('month')" style="padding:8px 15px; background:var(--accent-brown); color:white; border:none; touch-action:manipulation;">📊 統計</button>
        </div>
    </div>
    <div id="history-result-area" style="flex:1; overflow-y:auto; background:white; padding:15px; border-radius:10px; border:1px solid #eee;"></div>
</div>

<div id="admin-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h2 style="margin:0;">⚙️ 管理中心</h2>
        <div style="display:flex; gap:10px;">
            <select id="admin-cat-jump" onchange="jumpToAdminCat(this.value)" style="padding:8px; border-radius:5px;">
                <option value="">快速跳轉分類...</option>
            </select>
            <button onclick="exportToExcel()" style="padding:8px 15px; background:#217346; color:white; border:none; touch-action:manipulation;">📥 庫存匯出</button>
            <button onclick="backupData()" style="padding:8px 15px; background:#666; color:white; border:none; touch-action:manipulation;">💾 備份</button>
            <input type="file" id="import-file" style="display:none;" onchange="importData(event)">
            <button onclick="document.getElementById('import-file').click()" style="padding:8px 15px; background:#d9534f; color:white; border:none; touch-action:manipulation;">⚠️ 還原</button>
            <button onclick="toggleAdmin()" style="padding:8px 15px;">✕ 關閉</button>
        </div>
    </div>
    
    <div class="add-row-top">
        <div><label>選擇分類</label><select id="select-cat" onchange="checkNewCat(this.value)"></select></div>
        <div><label>代碼</label><input type="text" id="new-id" style="width:120px;"></div>
        <div><label>品名</label><input type="text" id="new-n" style="width:160px;"></div>
        <div><label>成本</label><input type="number" id="new-c" style="width:50px;"></div>
        <div><label>售價</label><input type="number" id="new-p" style="width:50px;"></div>
        <div><label>庫存</label><input type="number" id="new-s" style="width:50px;"></div>
        <div>
            <label>色塊</label>
            <select id="new-color" style="width:70px;">
                <option value="#FFFFFF">預設白</option>
                <option value="#FF0000">紅</option>
                <option value="#FF8800">橘</option>
                <option value="#FFEE99">黃</option>
                <option value="#CCBBFF">紫</option>
                <option value="#FF8888">玫紅</option>
                <option value="#33CCFF">藍</option>
                <option value="#FFB7DD">粉</option>
                <option value="#CCEEFF">冰藍</option>
                <option value="#EEFFBB">綠</option>
            </select>
        </div>
        <button onclick="addNewProduct()" style="background:var(--profit-green); color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold; touch-action:manipulation;">➕ 新增商品</button>
    </div>

    <div class="admin-layout">
        <div class="admin-table-container">
            <table>
                <thead><tr><th>順序</th><th>代碼</th><th>品名</th><th>成本</th><th>售價</th><th>庫存</th><th>色塊</th><th>刪</th></tr></thead>
                <tbody id="admin-tbody"></tbody>
            </table>
        </div>
        <div style="background:#f9f9f9; padding:15px; border-radius:10px; overflow-y:auto; display:flex; flex-direction:column;">
            <h3>📊 銷售排名</h3>
            <div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; background:#eee; padding:10px; border-radius:8px;">
                <select id="stat-year" style="padding:5px; flex:1;"></select>
                <select id="stat-month" style="padding:5px; flex:1;"></select>
                <button onclick="renderStatTable()" style="flex:1; background:var(--main-brown); color:white; border:none; border-radius:5px; cursor:pointer; touch-action:manipulation;">篩選</button>
                <button onclick="renderStatTable(true)" style="width:100%; margin-top:5px; padding:5px; background:#888; color:white; border:none; border-radius:5px; cursor:pointer; touch-action:manipulation;">不分銷售時間 (全部統計)</button>
            </div>
            
            <table style="font-size:0.9em;">
                <thead><tr style="background:#eee;"><th>品名</th><th>量</th><th>額</th></tr></thead>
                <tbody id="stat-tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC2IAICewOcuIj3aWMO9AZpg3tj7AKXwfU",
        authDomain: "astimegoesby-2025.firebaseapp.com",
        databaseURL: "https://astimegoesby-2025-default-rtdb.firebaseio.com",
        projectId: "astimegoesby-2025",
        storageBucket: "astimegoesby-2025.firebasestorage.app",
        messagingSenderId: "512097547664",
        appId: "1:512097547664:web:4858792047682a01acaf15"
    };

    let db;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
    } catch(e) { console.log("Firebase未配置"); }
    
    let inv = []; 
    let orders = [];
    let cart = []; 
    let currentPay = '現金';

    const colorOptionsHtml = `
        <option value="#FFFFFF">白</option>
        <option value="#FF0000">紅</option>
        <option value="#FF8800">橘</option>
        <option value="#FFEE99">黃</option>
        <option value="#CCBBFF">紫</option>
        <option value="#FF8888">玫紅</option>
        <option value="#33CCFF">藍</option>
        <option value="#FFB7DD">粉</option>
        <option value="#CCEEFF">冰藍</option>
        <option value="#EEFFBB">綠</option>
    `;

    let barcodeString = "";
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;

        if (e.key === "Enter") {
            if (barcodeString.length > 1) {
                handleManualBarcode(barcodeString);
            }
            barcodeString = "";
        } else {
            if (e.key.length === 1) barcodeString += e.key;
        }
    });

    function handleManualBarcode(val) {
        if(!val) return;
        const found = findProductById(val);
        const statusEl = document.getElementById('barcode-status');
        if (found) {
            addCart(found.id);
            statusEl.innerText = `✅ 已掃描: ${found.n}`;
            statusEl.style.background = "#dcfce7";
        } else {
            statusEl.innerText = `❌ 找不到代碼: ${val}`;
            statusEl.style.background = "#fee2e2";
        }
    }

    function handleFlavorChange(val) {
        if(!val) return;
        const priceInput = document.getElementById('manual-price-input');
        const match = val.match(/\+(\d+)$/);
        if(match) {
            const addAmt = Number(match[1]);
            const currentAmt = Number(priceInput.value) || 0;
            priceInput.value = currentAmt + addAmt;
        }
    }

    function addCustomPrice(price) {
        if(!price || isNaN(price) || Number(price) === 0) return;
        const nameInput = document.getElementById('manual-name-input');
        const flavorInput = document.getElementById('manual-flavor-input');
        const customName = nameInput.value.trim() || "手動輸入商品";
        const flavorSuffix = flavorInput.value ? `(${flavorInput.value})` : "";
        
        const customItem = {
            id: 'CUSTOM',
            n: `${customName}${flavorSuffix} (${price})`,
            p: Number(price),
            c: 0
        };
        cart.push(customItem);
        nameInput.value = '';
        document.getElementById('manual-price-input').value = '';
        flavorInput.value = ''; // 重置口味選單
        renderCart();
    }

    function findProductById(id) {
        let target = null;
        inv.forEach(c => (c.items || []).forEach(i => { if(String(i.id).toUpperCase() === String(id).toUpperCase()) target = i; }));
        return target;
    }

    function loadData() {
        if(db) {
            db.ref('inventory').on('value', snap => {
                inv = snap.val() || [{cat: "預設分類", items: []}];
                initUI();
            });
            db.ref('orders').on('value', snap => {
                const data = snap.val();
                orders = data ? Object.keys(data).map(k => ({...data[k], firebaseKey: k})) : [];
                orders.sort((a,b) => (b.d+b.t).localeCompare(a.d+a.t));
                updateLog(); 
                renderStatTable();
            });
        }
        const ySel = document.getElementById('stat-year');
        for(let y=2025; y<=2035; y++) ySel.innerHTML += `<option value="${y}">${y}年</option>`;
        const mSel = document.getElementById('stat-month');
        for(let m=1; m<=12; m++) mSel.innerHTML += `<option value="${m}">${m}月</option>`;
        ySel.value = new Date().getFullYear();
        mSel.value = new Date().getMonth() + 1;
    }
    loadData();

    function syncToDB() {
        initUI();
        if(db) db.ref('inventory').set(inv);
    }

    function initUI() {
        const area = document.getElementById('item-area'), nav = document.getElementById('navbar');
        const jumpSelect = document.getElementById('admin-cat-jump');
        area.innerHTML = ''; nav.innerHTML = '';
        if(jumpSelect) jumpSelect.innerHTML = '<option value="">快速跳轉分類...</option>';
        
        inv.forEach((cat, idx) => {
            nav.innerHTML += `<div class="nav-btn" onclick="document.getElementById('c${idx}').scrollIntoView()">${cat.cat}</div>`;
            if(jumpSelect) jumpSelect.innerHTML += `<option value="ac${idx}">${cat.cat}</option>`;
            
            let gridHtml = `<div class="cat-title" id="c${idx}">${cat.cat}</div><div class="product-grid">`;
            (cat.items || []).forEach(it => {
                const displayName = `${it.id} ${it.n}`;
                gridHtml += `
                    <div class="p-btn" onclick="addCart('${it.id}')" style="background-color: ${it.color || '#FFFFFF'};">
                        <div class="p-name">${displayName}</div>
                        <div class="p-price">$${it.p}</div>
                        <div class="p-stock">存:${it.s}</div>
                    </div>`;
            });
            area.innerHTML += gridHtml + '</div>';
        });
        updateCatSelect();
        if(document.getElementById('admin-panel').style.display === 'flex') renderAdminTable();
    }

    function calc() {
        const subtotal = cart.reduce((a, b) => a + b.p, 0);
        const discountVal = Number(document.getElementById('discount').value || 0);
        let rawTotal = subtotal - discountVal;
        let finalTotal = Math.max(0, rawTotal);
        document.getElementById('final-total').innerText = finalTotal;
        calcChange();
    }

    function calcChange() {
        const t = Number(document.getElementById('final-total').innerText);
        const p = Number(document.getElementById('cash-in').value || 0);
        document.getElementById('cash-change').innerText = p > t ? p - t : 0;
    }

    function applyQuickDiscount(type, val, label) {
        const subtotal = cart.reduce((a, b) => a + b.p, 0);
        const discInput = document.getElementById('discount');
        const noteInput = document.getElementById('discount-note');
        if(type === 'minus') {
            discInput.value = (Number(discInput.value) || 0) + val;
        } else if(type === 'percent') {
            discInput.value = Math.round(subtotal * (1 - val));
            if (label) {
                if (noteInput.value === "") {
                    noteInput.value = label;
                } else if (!noteInput.value.includes(label)) {
                    noteInput.value = noteInput.value + " (" + label + ")";
                }
            }
        } else if(type === 'reset') {
            discInput.value = '';
            noteInput.value = '';
        }
        calc();
    }

    function applyQuickCash(val) {
        const cashInput = document.getElementById('cash-in');
        if(val === 0) cashInput.value = '';
        else cashInput.value = (Number(cashInput.value) || 0) + val;
        calcChange();
    }

    function setPay(method) {
        currentPay = method;
        document.querySelectorAll('.pay-btn').forEach(btn => btn.classList.remove('active'));
        if(method === '現金') document.getElementById('btn-cash').classList.add('active');
        if(method === '信用卡') document.getElementById('btn-card').classList.add('active');
        if(method === 'LINE Pay') document.getElementById('btn-line').classList.add('active');
    }

    function renderStatTable(ignoreTime = false) {
        const y = document.getElementById('stat-year').value;
        const m = document.getElementById('stat-month').value;
        let filtered = orders;
        if(!ignoreTime) {
            filtered = orders.filter(o => {
                const parts = o.d.split('/');
                return parts[0] == y && parts[1] == m;
            });
        }
        let stats = {};
        filtered.forEach(o => {
            (o.items || []).forEach(it => {
                const itName = it.n;
                if(!stats[itName]) stats[itName] = { qty:0, amt:0 };
                stats[itName].qty++;
                stats[itName].amt += it.p;
            });
        });
        let sorted = Object.keys(stats).map(k => ({n:k, ...stats[k]})).sort((a,b) => b.qty - a.qty);
        document.getElementById('stat-tbody').innerHTML = sorted.map(s => `
            <tr><td style="text-align:left;">${s.n}</td><td>${s.qty}</td><td>${s.amt}</td></tr>
        `).join('');
    }

    function renderAdminTable() {
        let html = '';
        inv.forEach((cat, ci) => {
            html += `<tr id="ac${ci}" style="background:#eee;">
                <td colspan="8" style="text-align:left; padding:10px;">
                    <b>📂 ${cat.cat}</b>
                    <button class="sort-cat-btn" onclick="moveCategory(${ci}, -1)">↑ 上移</button>
                    <button class="sort-cat-btn" onclick="moveCategory(${ci}, 1)">↓ 下移</button>
                    <button class="edit-cat-btn" onclick="editCategoryName(${ci})">✏️ 改名</button>
                    <button class="del-cat-btn" onclick="deleteCategory(${ci})">🗑️ 刪除</button>
                </td>
            </tr>`;
            (cat.items || []).forEach((it, ii) => {
                html += `<tr>
                    <td><span onclick="move(${ci},${ii},-1)" style="cursor:pointer">↑</span> <span onclick="move(${ci},${ii},1)" style="cursor:pointer">↓</span></td>
                    <td><input type="text" value="${it.id || ''}" onchange="editItem(${ci},${ii},'id',this.value)" style="width:120px; text-align:center;"></td>
                    <td style="text-align:left;"><input type="text" value="${it.n}" onchange="editItem(${ci},${ii},'n',this.value)" style="width:140px;"></td>
                    <td><input type="number" value="${it.c}" onchange="editItem(${ci},${ii},'c',this.value)" style="width:45px;"></td>
                    <td><input type="number" value="${it.p}" onchange="editItem(${ci},${ii},'p',this.value)" style="width:45px;"></td>
                    <td><input type="number" value="${it.s}" onchange="editItem(${ci},${ii},'s',this.value)" style="width:45px;"></td>
                    <td>
                        <select onchange="editItem(${ci},${ii},'color',this.value)" style="background:${it.color || '#fff'}; width:65px;">
                            ${colorOptionsHtml.replace(`value="${it.color}"`, `value="${it.color}" selected`)}
                        </select>
                    </td>
                    <td><span onclick="delP(${ci},${ii})" class="del-x">✕</span></td>
                </tr>`;
            });
        });
        document.getElementById('admin-tbody').innerHTML = html;
    }

    function addCart(id) {
        let target = findProductById(id);
        if(target) { cart.push({...target}); renderCart(); }
    }
    function renderCart() {
        document.getElementById('cart-list').innerHTML = cart.map((it, i) => {
            const displayName = it.n;
            return `<div class="cart-item"><span>${displayName}</span><b>$${it.p}</b>
            <span onclick="cart.splice(${i},1);renderCart()" style="color:red; cursor:pointer;">✕</span></div>`;
        }).join('');
        calc();
    }
    
    function submitOrder() {
        if(!cart.length) return;
        const total = Number(document.getElementById('final-total').innerText);
        const orderDate = document.getElementById('backdate-mode').checked ? 
            new Date(document.getElementById('manual-date').value).toLocaleDateString('zh-TW') : 
            new Date().toLocaleDateString('zh-TW');
        const taxId = document.getElementById('tax-id').value;
        
        const flavorVal = document.getElementById('manual-flavor-input').value;
        const noteVal = document.getElementById('discount-note').value;
        let finalNote = flavorVal;
        if(flavorVal && noteVal) {
            finalNote = flavorVal + " / " + noteVal;
        } else if(noteVal) {
            finalNote = noteVal;
        }
            
        const orderData = { 
            t: new Date().toLocaleTimeString('zh-TW', {hour12:false}), 
            d: orderDate,
            total, 
            profit: total - cart.reduce((a,b)=>a+(b.c||0), 0), 
            pay: currentPay, 
            items: [...cart], 
            note: finalNote,
            taxId: taxId
        };

        cart.forEach(item => { 
            if(item.id !== 'CUSTOM') {
                inv.forEach(c => (c.items || []).forEach(i => { if(i.id === item.id) i.s--; })); 
            }
        });
        
        db.ref('orders').push(orderData);
        db.ref('inventory').set(inv);

        alert("結帳成功！訂單已儲存至雲端");
        
        cart=[]; 
        document.getElementById('discount').value = '';
        document.getElementById('cash-in').value = '';
        document.getElementById('tax-id').value = '';
        document.getElementById('manual-flavor-input').value = '';
        document.getElementById('discount-note').value = '';
        document.getElementById('barcode-status').innerText = '⌛ 條碼槍就緒';
        document.getElementById('barcode-status').style.background = "#eee";
        renderCart(); 
    }

    function updateLog() {
        const today = new Date().toLocaleDateString('zh-TW');
        const todayOrders = orders.filter(o => o.d === today);
        document.getElementById('order-log').innerHTML = todayOrders.map(o => `
            <div style="padding:5px; border-bottom:1px solid #eee; font-size:0.9em;">
                ${o.t} | $${o.total} (${o.pay}) | ${o.items.map(i => i.n).join(',')}
            </div>
        `).join('');
    }

    function addExtraCost() {
        const reason = prompt("請輸入支出項目名稱 (例如：補貨、文具)：");
        if (!reason) return;
        const amount = Number(prompt("請輸入支出金額："));
        if (isNaN(amount) || amount <= 0) return alert("請輸入有效金額");

        const orderDate = document.getElementById('backdate-mode').checked ? 
            new Date(document.getElementById('manual-date').value).toLocaleDateString('zh-TW') : 
            new Date().toLocaleDateString('zh-TW');

        const expenseData = {
            t: new Date().toLocaleTimeString('zh-TW', {hour12:false}),
            d: orderDate,
            total: -amount, 
            profit: -amount,
            pay: '支出',
            items: [{ id: 'EXP', n: `[支出] ${reason}`, p: -amount, c: 0 }],
            note: reason
        };

        if(db) {
            db.ref('orders').push(expenseData);
            alert("支出紀錄已儲存！");
        }
    }

    function toggleAdmin() {
        const p = document.getElementById('admin-panel');
        p.style.display = (p.style.display === 'flex' ? 'none' : 'flex');
        if(p.style.display === 'flex') renderAdminTable();
    }

    function updateCatSelect() {
        const sel = document.getElementById('select-cat');
        sel.innerHTML = inv.map(c => `<option value="${c.cat}">${c.cat}</option>`).join('') + '<option value="new">+ 新增分類</option>';
    }

    function checkNewCat(v) {
        if(v === 'new') {
            const n = prompt("新分類名稱:");
            if(n) {
                inv.push({cat: n, items: []});
                syncToDB();
            } else {
                updateCatSelect();
            }
        }
    }

    function addNewProduct() {
        const catN = document.getElementById('select-cat').value;
        const id = document.getElementById('new-id').value;
        const n = document.getElementById('new-n').value;
        const c = Number(document.getElementById('new-c').value);
        const p = Number(document.getElementById('new-p').value);
        const s = Number(document.getElementById('new-s').value);
        const color = document.getElementById('new-color').value;
        if(!n || !catN) return alert("請填寫品名");
        const category = inv.find(v => v.cat === catN);
        if(category) {
            if(!category.items) category.items = [];
            category.items.push({ id: id || Date.now().toString().slice(-4), n, c, p, s, color });
            syncToDB();
            document.getElementById('new-id').value='';
            document.getElementById('new-n').value='';
            document.getElementById('new-c').value='';
            document.getElementById('new-p').value='';
            document.getElementById('new-s').value='';
        }
    }

    function editItem(ci, ii, field, val) {
        if(field==='c' || field==='p' || field==='s') val = Number(val);
        inv[ci].items[ii][field] = val;
        syncToDB();
    }

    function delP(ci, ii) {
        if(confirm("確定刪除此商品?")) {
            inv[ci].items.splice(ii, 1);
            syncToDB();
        }
    }

    function move(ci, ii, dir) {
        const items = inv[ci].items;
        if(dir === -1 && ii > 0) [items[ii], items[ii-1]] = [items[ii-1], items[ii]];
        if(dir === 1 && ii < items.length-1) [items[ii], items[ii+1]] = [items[ii+1], items[ii]];
        syncToDB();
    }

    function moveCategory(ci, dir) {
        if(dir === -1 && ci > 0) [inv[ci], inv[ci-1]] = [inv[ci-1], inv[ci]];
        if(dir === 1 && ci < inv.length-1) [inv[ci], inv[ci+1]] = [inv[ci+1], inv[ci]];
        syncToDB();
    }

    function editCategoryName(ci) {
        const newN = prompt("修改分類名稱:", inv[ci].cat);
        if(newN) { inv[ci].cat = newN; syncToDB(); }
    }

    function deleteCategory(ci) {
        if(confirm(`確定刪除分類「${inv[ci].cat}」及其所有商品嗎？`)) {
            inv.splice(ci, 1);
            syncToDB();
        }
    }

    function jumpToAdminCat(val) {
        if(val) {
            const el = document.getElementById(val);
            if(el) el.scrollIntoView({behavior: "smooth"});
        }
    }

    function toggleHistory() {
        const p = document.getElementById('history-panel');
        p.style.display = (p.style.display === 'flex' ? 'none' : 'flex');
    }

    function searchToday() {
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        document.getElementById('search-date').value = `${y}-${m}-${d}`;
        searchHistory('day');
    }

    function searchHistory(type) {
        const resArea = document.getElementById('history-result-area');
        let filtered = [];
        if(type === 'day') {
            const d = document.getElementById('search-date').value;
            if(!d) return alert("請選擇日期");
            const targetD = new Date(d).toLocaleDateString('zh-TW');
            filtered = orders.filter(o => o.d === targetD);
        } else {
            const m = document.getElementById('search-month').value;
            if(!m) return alert("請選擇月份");
            filtered = orders.filter(o => {
                const parts = o.d.split('/');
                return `${parts[0]}-${parts[1].padStart(2,'0')}` === m;
            });
        }

        let totalS = filtered.reduce((a,b)=>a+b.total, 0);
        let totalP = filtered.reduce((a,b)=>a+b.profit, 0);

        resArea.innerHTML = `
            <div style="background:#eee; padding:10px; border-radius:8px; margin-bottom:10px; font-weight:bold;">
                總銷售額: $${totalS} | 總毛利: $${totalP}
            </div>
            ${filtered.map(o => `
                <div style="border-bottom:1px solid #ddd; padding:10px; display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <b>${o.d} ${o.t}</b> [${o.pay}]<br>
                        ${o.items.map(i => i.n).join(', ')}<br>
                        <small style="color:#666;">備註: ${o.note || '無'}</small>
                    </div>
                    <div style="text-align:right;">
                        <span style="font-size:1.2em; font-weight:bold; color:var(--price-red);">$${o.total}</span><br>
                        <button onclick="refundOrder('${o.firebaseKey}')" style="color:red; background:none; border:1px solid red; border-radius:4px; padding:2px 5px; cursor:pointer; margin-top:5px; touch-action:manipulation;">退貨</button>
                    </div>
                </div>
            `).join('')}
        `;
    }

    function refundOrder(key) {
        if(confirm("確定要進行退貨？這會刪除此筆交易並恢復庫存。")) {
            const order = orders.find(o => o.firebaseKey === key);
            if(order && order.pay !== '支出') {
                order.items.forEach(item => {
                    if(item.id !== 'CUSTOM') {
                        inv.forEach(c => (c.items || []).forEach(i => { if(i.id === item.id) i.s++; }));
                    }
                });
                db.ref('inventory').set(inv);
            }
            db.ref('orders').child(key).remove();
            alert("已完成退貨處置");
        }
    }

    function exportToExcel() {
        let data = [];
        inv.forEach(c => (c.items || []).forEach(i => data.push({分類: c.cat, 代碼: i.id, 品名: i.n, 成本: i.c, 售價: i.p, 庫存: i.s})));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "庫存");
        XLSX.writeFile(wb, `時光造所_庫存_${new Date().toLocaleDateString()}.xlsx`);
    }

    function exportHistoryToExcel() {
        let data = orders.map(o => ({
            日期: o.d, 時間: o.t, 總額: o.total, 毛利: o.profit, 支付: o.pay, 備註: o.note, 載具統編: o.taxId || '',
            內容: o.items.map(i => i.n).join(';')
        }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "歷史紀錄");
        XLSX.writeFile(wb, `時光造所_銷售紀錄_${new Date().toLocaleDateString()}.xlsx`);
    }

    function backupData() {
        const data = { inv, orders };
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `時光造所_備份_${new Date().getTime()}.json`;
        a.click();
    }

    function importData(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if(data.inv && confirm("確定要還原備份資料嗎？這將覆蓋現有數據。")) {
                    db.ref('inventory').set(data.inv);
                    if(data.orders) db.ref('orders').set(data.orders);
                    alert("還原成功！");
                }
            } catch(err) { alert("檔案格式錯誤"); }
        };
        reader.readAsText(file);
    }

    function syncOfflineData() {
        alert("目前正處於在線模式，數據已即時同步。");
    }

    function clearAllHistory() {
        if(confirm("⚠️ 警告：這將永久刪除所有歷史銷售紀錄，確定執行？")) {
            if(confirm("請再次確認：此動作無法復原！")) {
                db.ref('orders').remove();
                alert("已清空歷史紀錄");
            }
        }
    }
</script>

</body>
</html>
